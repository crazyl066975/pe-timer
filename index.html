<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="referrer" content="no-referrer">

<style>

:root{--bg:#0a1222;--card:#141e36;--card2:#1b2848;--line:#26345a;--ink:#f1f5ff;--muted:#93a3c4;--primary:#2f6bff;--accent:#22c3ee;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--num:"DIN Alternate","Bahnschrift","Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}

body{padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(76px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

.st{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.start{width:100%;padding:18px;font-size:21px;font-weight:800;background:linear-gradient(135deg,#3b7bff,#1f4fd6);box-shadow:0 10px 24px -10px #2f6bffcc}

.item.pmrow{grid-template-columns:1fr 150px}.pmw{display:flex;gap:6px}.pmw input{min-width:0}.item.hwrow{grid-template-columns:1fr 176px}.hww{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hww input{min-width:0;padding:9px 4px}.pm{flex:0 0 42px;font:700 20px var(--num);border-radius:10px;background:#ffffff1a;border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:7px 12px;font-size:14px;border-radius:99px}.chips button.on{background:var(--primary);color:#fff}

.course{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px;background:var(--card2);border-radius:16px;margin-top:8px;text-align:left;width:100%}
.course.now{background:linear-gradient(135deg,#1d4ed8,#0e7490)}.course.past{opacity:.5}
.course .tm{font:700 15px/1.25 var(--num);color:var(--accent)}.course.now .tm{color:#fff}.course .tm small{display:block;opacity:.75;font-weight:400}
.course strong{font-size:17px;display:block}.course span{font-size:13px;color:var(--muted)}.course.now span{color:#dbeafe}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#ffffff22;margin-left:6px;vertical-align:2px}
.lesson{white-space:pre-wrap;font-size:15px;line-height:1.7;background:#0f1a30;border-radius:14px;padding:12px;margin-top:10px;-webkit-user-select:text;user-select:text}

nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(8,1fr);background:#0d1629ee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:5}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:99px;font-size:15px;display:none;z-index:9;max-width:90vw;text-align:center}
.welcome{text-align:center;padding-top:9vh}.welcome .logo{width:96px;height:96px;border-radius:26px;margin:0 auto 18px;display:block}

.scan{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center}.scan video{width:100%;height:100%;object-fit:cover}.scan .frame{position:absolute;width:66vmin;height:66vmin;border:3px solid var(--accent);border-radius:22px;box-shadow:0 0 0 100vmax #0008}.scan .tip{position:absolute;top:max(30px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:17px}.scan button{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));padding:14px 40px;background:#ffffff22}
.cam{width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover;display:block}

.bar{height:6px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(92vw,420px);padding:16px}dialog::backdrop{background:#0009}
.pick{display:grid;gap:6px;max-height:60vh;overflow:auto}.pick button{padding:12px;text-align:left}
.empty{text-align:center;color:var(--muted);padding:26px 6px}
.upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);background:var(--primary);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;z-index:15;box-shadow:0 8px 24px -8px #000;white-space:nowrap}

.bub{max-width:88%;padding:10px 12px;border-radius:16px;white-space:pre-wrap;line-height:1.65;font-size:15px;-webkit-user-select:text;user-select:text;word-break:break-word}

.bub .cp{display:block;margin-top:8px;padding:4px 10px;font-size:12px;background:#ffffff14;border-radius:8px}
.think{color:var(--muted)}.think::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;animation:bl 1s infinite}
.askbox{display:flex;gap:8px;align-items:stretch;margin-top:6px}.askbox textarea{min-height:54px;resize:none;flex:1}.askbox .start{flex:0 0 auto;white-space:nowrap}
.cntc{width:100%;height:auto;border-radius:16px;background:#000;display:block}
.cnt-st{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:8px 2px}
.cnt-res{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 8px}.cnt-res b{font:700 72px/1 var(--num);min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}.cnt-res button{width:58px;height:58px;font:700 28px var(--num);border-radius:16px;background:#ffffff1a}
.cnwho{width:100%;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin:4px 0 10px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;margin:4px 0}.chk input{width:22px;height:22px;flex:0 0 auto}
/* 同事对讲：开关、圆形「按住说话」、每一页底下的对讲栏 */
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tk-sw{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;background:#ffffff12;font-size:15px;font-weight:700;color:var(--muted);flex:0 0 auto}
.tk-sw i{width:46px;height:28px;border-radius:99px;background:#475569;position:relative;transition:background .2s}.tk-sw i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0006;transition:left .2s}
.tk-sw.on{color:#d1fae5}.tk-sw.on i{background:var(--ok)}.tk-sw.on i::after{left:21px}
.ptt{display:grid;place-items:center;width:min(64vw,236px);height:min(64vw,236px);margin:4px auto 16px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#5b93ff,#1f4fd6 70%);box-shadow:0 0 0 calc(6px + var(--lv,0)*22px) #2f6bff33,0 16px 34px -14px #2f6bffcc;color:#fff;touch-action:none;-webkit-touch-callout:none;transition:box-shadow .08s}
.ptt b{display:block;font-size:25px}.ptt small{display:block;font-size:13px;opacity:.85;margin-top:4px}
.ptt.tx{background:radial-gradient(circle at 50% 30%,#ff7a90,#d91f4a 70%);box-shadow:0 0 0 calc(6px + var(--lv,0)*26px) #fb718544,0 16px 34px -14px #d91f4acc}
.ptt.rx{background:radial-gradient(circle at 50% 30%,#3ee0c8,#0e7490 72%);animation:tkp 1.2s infinite}.ptt.wait{background:#26345a;color:var(--muted);box-shadow:none}
@keyframes tkp{0%,100%{box-shadow:0 0 0 8px #22c3ee22}50%{box-shadow:0 0 0 20px #22c3ee11}}
.tk-qr{background:#fff;border-radius:14px;padding:8px;width:min(70vw,270px);margin:0 auto}.tk-qr svg{display:block;width:100%;height:auto}
.tbar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;background:#172a52f2;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #2f4677;border-radius:18px;z-index:6;box-shadow:0 12px 30px -14px #000}
.tbar[hidden]{display:none}body.nonav .tbar{bottom:calc(12px + env(safe-area-inset-bottom))}
.tb-info{flex:1;min-width:0;display:grid;text-align:left;background:none;padding:2px 0;border-radius:10px}.tb-info b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-ptt{flex:0 0 auto;padding:13px 16px;font-size:16px;font-weight:800;background:var(--primary);color:#fff;touch-action:none;-webkit-touch-callout:none;box-shadow:0 0 0 calc(var(--lv,0)*10px) #fb718566}
.tb-ptt.tx{background:#e11d48}.tb-ptt.rx{background:#0e7490}.tb-ptt.wait{background:#26345a;color:var(--muted)}
.tb-off{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:#ffffff14;color:var(--muted);font-size:15px}
body.talkon{padding-bottom:calc(140px + env(safe-area-inset-bottom))}body.talkon.nonav{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.talkon .toast{bottom:calc(150px + env(safe-area-inset-bottom))}body.talkon.nonav .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.rxdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:bl 1s infinite;vertical-align:1px}
.tk-bg{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:#ffffff0d;font-size:14px;line-height:1.6;color:#cfe3ff}.tk-bg:empty{display:none}.tk-bg.lock{background:#3a3415;color:#ffe08a;font-weight:700}.tk-bg.warn{background:#3b1d27;color:#fecdd3}
.tk-bg button{display:block;width:100%;margin-top:8px;padding:9px 12px;font-size:14px;background:#ffffff14;color:var(--ink);border-radius:10px;text-align:left}.tbar.lock .tb-info span{color:var(--warn);font-weight:700}
@media(prefers-reduced-motion:reduce){.ptt.rx,.rxdot{animation:none}}
</style></head><body>
<header id="head"></header>
<div id="apkUpd" class="card" hidden style="border-color:var(--primary)"></div>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div class="tbar" id="tbar" hidden><button class="tb-info" onclick="go('talk')"><b id="tbT"></b><span id="tbS"></span></button><button class="tb-ptt" id="tbP" onpointerdown="pttDown(event)" oncontextmenu="return false">按住说话</button><button class="tb-off" onclick="talkStop();toast('对讲已关闭');if(tab==='talk')draw()" aria-label="关闭对讲">✕</button></div>
<dialog id="dlg"><div class="pick" id="pick"></div><button class="ghost" style="width:100%;margin-top:10px" onclick="dlg.close()">取消</button></dialog>
<div class="toast" id="toast"></div>
<button class="upd" id="upd" hidden onclick="location.reload()">有新版本，点这里更新</button>
<script src="relay.js"></script>
<script src="talk.js"></script>
<script src="qrcode.js"></script>
<script src="counter.js"></script>
<script src="jsQR.js"></script>
<script>
// ======== 体育助手（手机端）：和电脑上的「体育教师工作台」配对后，课表教案自动同步，计时/成绩/练习/视频直接传回电脑 ========
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='pe-assistant-v1',APP_VER='1.9.5';
{const d=document.getElementById('dlg');if(typeof d.showModal!=='function'){d.showModal=function(){this.setAttribute('open','');this.style.cssText='display:block;position:fixed;top:12vh;left:50%;transform:translateX(-50%);z-index:30;margin:0'};d.close=function(){this.removeAttribute('open');this.style.display='none'};Object.defineProperty(d,'open',{get(){return this.hasAttribute('open')}})}}
let D={room:'',key:'',session:null,queue:[],done:{},ended:[]};try{Object.assign(D,JSON.parse(localStorage.getItem(LS))||{})}catch{}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(D))}catch{toast('手机存储空间不够了')}};
let tab='today',room=null,lastPong=0,timerMode='lanes';
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2400)};
const mid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let ac=null;const ctx=()=>{ac??=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function beep(f=880,d=.12,v=.4){try{const c=ctx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}catch{}}
function whistle(d=.8){try{const c=ctx(),t=c.currentTime,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.frequency.value=2750;l.frequency.value=26;lg.gain.value=220;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.03);g.gain.setValueAtTime(.35,t+d-.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+d);l.stop(t+d)}catch{}}
const vibe=ms=>{try{navigator.vibrate?.(ms)}catch{}};
const S=()=>D.session||{className:'',classes:[],metrics:[],items:[],students:[],plan:{times:[],week:{},lessons:[]}};
// ======== 连接电脑 ========
const online=()=>!!room?.up&&Date.now()-lastPong<25000;
function parseLink(txt){try{const h=String(txt).split('#')[1]||'',p=new URLSearchParams(h),r=p.get('r'),k=p.get('k');return PERelay.okRoom(r)&&PERelay.okKey(k)?{room:r,key:k,srv:p.get('s')||''}:null}catch{return null}}
async function pair(link){const p=parseLink(link);if(!p){toast('这不是工作台的连接码');return false}
 if(D.room&&D.room!==p.room&&D.queue.length&&!confirm(`还有 ${D.queue.length} 条没传到电脑，换电脑后这些会丢掉，确定？`))return false;
 D={room:p.room,key:p.key,srv:p.srv,session:D.room===p.room?D.session:null,queue:D.room===p.room?D.queue:[],done:D.room===p.room?D.done:{},ended:(D.ended||[]).filter(r=>r!==p.room)};persist();await connect();tab='today';draw();toast('已连接，正在同步课表…');if(!standalone&&/iPhone|iPad/.test(navigator.userAgent))setTimeout(()=>toast('点下方「分享」→「添加到主屏幕」，以后像 App 一样打开'),3500);return true}
async function connect(){room?.close();room=null;if(!D.room)return;
 try{room=await PERelay.openRoom({room:D.room,key:D.key,side:'phone',urls:PERelay.phoneUrls(D.srv),onMsg,onState:up=>{if(up){room.send({t:'hello'});flush()}head()}})}catch(e){toast(e.message)}}
function onMsg(m){lastPong=Date.now();
 if(m.t==='session'){const had=!!D.session;D.session=m;delete m.t;persist();if(!had)toast('课表和名单已同步');overlay();draw()}
 else if(m.t==='pong'){}
 else if(m.t==='aiwait'){const r=aiReq[m.mid];if(r){r.wait=true;r.last=Date.now()}}
 else if(m.t==='ack'&&aiReq[m.mid])aiDone(m);
 else if(m.t==='ack'){const q=D.queue.find(x=>x.mid===m.mid);D.queue=D.queue.filter(x=>x.mid!==m.mid);persist();if(q&&!m.ok){toast(m.reason||'电脑没收下');if(q.t==='score')delete D.done[q.id+'|'+q.metric]}if(q?.t==='score'&&m.ok){const s=S().students.find(x=>x.id===q.id);if(s){if(m.value==='')delete s.sc[q.metric];else s.sc[q.metric]=m.value}}draw(true)}
 else if(m.t==='vok'||m.t==='vdone')vidMsg(m);
 else if(m.t==='bye'){room?.close();room=null;D.ended=[...(D.ended||[]),D.room].slice(-10);D.room='';D.key='';D.queue=[];persist();toast('电脑那边结束了连接，需要时重新扫码');draw()}
 head()}
// 没收到回复的，每 4 秒重发一次；手机没信号时攒着，等有信号再发
function flush(){if(!room?.up)return;for(const q of D.queue.slice(0,20))room.send(q)}
setInterval(()=>{if(room?.up){room.send({t:'ping'});flush()}head()},5000);
function enqueue(msg){msg.mid=mid();D.queue.push(msg);persist();if(room?.up)room.send(msg);head();return msg}

const talkTips=()=>`<p class="muted" style="margin:14px 2px 0;font-size:13px;line-height:1.75">· 打开对讲以后可以锁屏、放口袋里，同事说话照样放出来。苹果手机要 iOS 17.5 以上、用 Safari 打开，打开后先点一下屏幕；安卓手机用体育助手 App 最稳。<br>· 放进口袋前按一下电源键锁屏，免得误按到「按住说话」。<br>· 开着对讲比较费电，不用的时候点右上角关掉。<br>· 说的话慢 1 秒左右才传到，发令起跑还是用哨子。<br>· 声音加密以后经中转站转给频道里的人，不保存，没进频道的人听不到。<br>· 操场太吵听不清时，戴一只蓝牙耳机最好。</p>`;
function talkPage(){const a=$('app'),me=esc(TC.me||'');
 if(tInv){a.innerHTML=`<section class="card"><h2>加入「${esc(tInv.cname)}」对讲</h2><p class="muted" style="margin:0 0 12px">同事邀请你进这个对讲频道：进去以后按住按钮说话，频道里的人手机上直接放出来。</p><label class="muted">你的称呼（同事会看到）</label><input id="tme" maxlength="8" placeholder="比如：李老师" value="${me}"><button class="start" style="margin-top:12px" onclick="talkJoin()">加入并打开对讲</button><button class="ghost" style="width:100%;margin-top:8px" onclick="tInv=null;draw()">不加入</button>${TC.room&&TC.room!==tInv.room?`<p class="muted" style="margin:10px 0 0">加入后会退出现在的「${esc(TC.cname)}」频道。</p>`:''}</section>${talkTips()}`;return}
 if(!TC.room){a.innerHTML=tForm==='new'?`<section class="card"><h2>建一个对讲频道</h2><label class="muted">频道名字</label><input id="tcn" maxlength="12" value="体育组"><label class="muted" style="display:block;margin-top:10px">你的称呼（同事会看到）</label><input id="tme" maxlength="8" placeholder="比如：李老师" value="${me}"><button class="start" style="margin-top:12px" onclick="talkCreate()">建好了，打开对讲</button><button class="ghost" style="width:100%;margin-top:8px" onclick="tForm='';draw()">取消</button></section>`
  :`<section class="card"><h2>同事对讲</h2><p class="muted" style="margin:0 0 12px">几个老师进同一个频道，按住说话，大家手机上直接放出来，像对讲机一样。不用连电脑。</p><button class="start" onclick="tForm='new';draw()">建一个频道</button><div class="row2"><button class="ghost" onclick="scanStart('talk')">扫码加入</button><button class="ghost" onclick="talkPaste()">粘贴邀请链接</button></div><p class="muted" style="margin:10px 0 0">一个人建好频道，把邀请发给同事；同事扫码或者点开邀请链接就进来了。</p></section>${talkTips()}`;return}
 const on=!!tch,hh=on?talkHist():'';talkPaint.h=hh;
 a.innerHTML=`<section class="card"><div class="tk-top"><div style="min-width:0"><h2 style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(TC.cname)}</h2><div class="st" id="tkst">${on?'':'<span class="dot"></span>关着'}</div></div><button class="tk-sw ${on?'on':''}" role="switch" aria-checked="${on}" onclick="talkToggle()"><i></i>${on?'开着':'关着'}</button></div>
  <p class="muted" id="tkmem" style="margin:10px 0 0">${on?'':'对讲关着：不连网、不开麦克风，也不会响。要用的时候点右上角的开关。'}</p>${on?'<p class="tk-bg" id="tkbg"></p>':''}</section>
  ${on?`<button class="ptt" id="ptt" onpointerdown="pttDown(event)" oncontextmenu="return false"><span><b id="pttT"></b><small id="pttS"></small></span></button><section class="card"><h2>刚才的话</h2><div id="tkhist">${hh}</div></section>`:''}
  <section class="card"><h2>邀请同事</h2><p class="muted" style="margin:0 0 4px">把邀请发到同事群，或者让同事用体育助手扫你的码。谁拿到邀请都能进，只发给同事。</p><div class="row2"><button class="ghost" onclick="talkQr()">显示二维码</button><button class="ghost" onclick="talkShare()">发给同事</button></div></section>
  <div class="row2"><button class="ghost" onclick="talkRename()">改称呼（${me}）</button><button class="ghost" onclick="talkLeave()">退出频道</button></div>${talkTips()}`}
function talkCreate(){const me=$('tme').value.trim().slice(0,8);if(!me){toast('先写上你的称呼');$('tme').focus();return}Object.assign(TC,PETalk.create($('tcn').value),{me});tForm='';tcSave();ctx();talkStart();draw();toast('频道建好了：点「发给同事」邀请大家')}
function talkJoin(){const me=$('tme').value.trim().slice(0,8);if(!me){toast('先写上你的称呼');$('tme').focus();return}const v=tInv;tInv=null;Object.assign(TC,{room:v.room,key:v.key,srv:v.srv,cname:v.cname,me});tcSave();ctx();talkStart();draw();toast('进来了：按住按钮就能说话')}
function talkInvite(txt){const v=PETalk.parse(txt);if(!v){toast('这不是对讲邀请');return}if(v.room===TC.room&&TC.me){if(!tch){ctx();talkStart()}toast('你已经在这个频道里了')}else tInv=v;tab='talk';draw()}
function talkPaste(){$('pick').innerHTML=`<p style="margin:0 0 6px">把同事发来的邀请链接粘贴到这里：</p><input id="tpl" placeholder="https://…#tr=…"><button class="start" style="margin-top:10px" onclick="const v=$('tpl').value;dlg.close();talkInvite(v)">加入</button>`;$('dlg').showModal()}
function talkQr(){const u=PETalk.link(TC);let svg='';try{const q=qrcode(0,'M');q.addData(u);q.make();svg=q.createSvgTag(5,2)}catch{}
 $('pick').innerHTML=`<p style="margin:0 0 8px;text-align:center">同事打开体育助手 →「对讲」→「扫码加入」<br><span class="muted">也可以用手机相机扫</span></p><div class="tk-qr">${svg||'<p class="muted">生成不了二维码，请用「发给同事」</p>'}</div><p class="muted" style="text-align:center;margin:8px 0 0">${esc(TC.cname)} · 谁扫到都能进，只给同事扫</p>`;$('dlg').showModal()}
async function talkShare(){const u=PETalk.link(TC),t=`进「${TC.cname}」对讲（体育助手）：`;
 if(navigator.share)try{await navigator.share({title:'同事对讲',text:t,url:u});return}catch(e){if(e?.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t+u);toast('邀请已复制：粘贴到同事群里就行')}catch{prompt('复制这个邀请链接，发到同事群里：',u)}}
function talkRename(){const n=prompt('你的称呼（同事会看到）：',TC.me||'');if(n===null)return;const v=n.trim().slice(0,8);if(!v)return;TC.me=v;tcSave();if(tch)talkStart();draw()}
function talkLeave(){if(!confirm(`退出「${TC.cname}」频道？以后要再进，得让同事重新发一次邀请。`))return;talkStop();TC={id:TC.id,me:TC.me};tcSave();draw()}
function talkReplay(i){if(!tch)return;if(tch.replaying===i){tch.stopReplay();talkPaint();return}const a=ctx();if(a.state==='running')tch.replay(i);else a.resume().then(()=>{tch?.replay(i);talkPaint()}).catch(()=>toast('放不出来，点一下屏幕再试'));talkPaint()}
// 按住说话：手指移开按钮也算按着，松手（哪里松都算）才停
function pttDown(e){e.preventDefault();if(!tch||pttHeld)return;pttHeld=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}ctx();vibe(25);
 tch.startTalk(()=>pttHeld).then(r=>{const m={busy:`${tch?.talker()?.n||'同事'}在说，等对方说完`,offline:'还没连上中转站，等一下再说',mic:'打不开麦克风：请允许「体育助手」（或浏览器）使用麦克风',nomic:'这台手机没找到麦克风',cancel:'要按住不放，边按边说，说完再松手'}[r];if(m)toast(m);talkUi()})}
function pttUp(){if(!pttHeld)return;pttHeld=false;tch?.stopTalk();talkUi()}
addEventListener('pointerup',pttUp);addEventListener('pointercancel',pttUp);addEventListener('blur',pttUp);
// 切到后台：松开按钮（对讲照样开着，锁屏也收）。回来时看一眼连接：在后台待了 20 秒以上、25 秒没动静的就重连
document.addEventListener('visibilitychange',()=>{if(document.hidden){tHid=Date.now();pttUp();return}tkInfoAt=0;if(tch){tch.pulse(tHid&&Date.now()-tHid>20000?25000:0);if(!talkBg().ok)talkWake();talkMedia();talkUi()}});
// 苹果手机要点一下屏幕声音才放得出来；声音被打断后有时一直卡在「interrupted」，点了也不恢复：换一个新的声卡，再点一下就好
document.addEventListener('pointerdown',()=>{const a=ac;if(!tch||!a||a.state==='running')return;try{a.resume().catch(()=>{})}catch{}
 if(a.state==='interrupted')setTimeout(()=>{if(ac===a&&a.state!=='running'&&tch){try{a.close()}catch{}ac=null;talkHook();talkUi()}},800)},true);
// ======== 页面 ========
function draw(soft){head();nav();if(!D.room)(tab==='talk'?talkPage:welcome)();
 else if(!(soft&&['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)))({today,timer,score,practice,count:countPage,video,ai,talk:talkPage})[tab](); // 正在输入时不打断
 talkPaint()}
// 安卓 App 的返回键
window.appBack=()=>{if($('scan')){scanStop();return true}if($('dlg').open){$('dlg').close();return true}if(tab==='count'&&cn.phase!=='idle'){if(cnBusy())toast('先点「结束」');else{cnClose();draw()}return true}if(tab!=='today'&&!running&&!cdEnd){go('today');return true}return false};
document.addEventListener('click',()=>{try{navigator.wakeLock?.request('screen').catch(()=>{})}catch{}},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(D.room&&!room)connect();else room?.send({t:'hello'});draw(true)}});
setInterval(()=>{if(tab==='today'&&D.room&&!document.hidden&&document.activeElement?.tagName!=='INPUT'&&!$('dlg').open)today()},60000);
// 网页版（iPhone 添加到主屏幕）：网址里带着连接码就直接配对，然后把它从地址栏去掉
// iPhone 在 Safari 里先别去掉 # 后面的连接码：这样「添加到主屏幕」以后，桌面图标打开就自动连上
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||/androidplatform/.test(location.host);
// 网址里带着对讲邀请（#tr=…）：去「对讲」页问要不要加入（已经在这个频道里就直接打开），然后把邀请从地址栏去掉；上次对讲开着，这次接着开
{const ti=PETalk.parse(location.href);if(ti){if(ti.room===TC.room&&TC.me)TC.on=true;else tInv=ti;tab='talk';if(!parseLink(location.href))history.replaceState(null,'',location.pathname+location.search)}}
if(TC.on&&TC.room&&TC.me)talkStart();
const href=location.href,lk=parseLink(href);if(lk&&(D.ended||[]).includes(lk.room)){history.replaceState(null,'',location.pathname);overlay();connect();draw();if(!D.room)toast('这次连接已经结束，请在电脑上重新开始连接后再扫码')}else if(lk){if(standalone)history.replaceState(null,'',location.pathname);pair(href)}else{overlay();connect();draw()}
vidLoad();
// 网页版有新版本时：手边没在用就自动刷新；正在计时、录像、输入时，顶部提示点一下再更新
// 新的离线缓存接手（sw）时就算刚刷新过也再刷新一次：它是整套重新下载的，刚才那次可能拿到新页面配旧文件（1.6 就因此看不到颠球）
function appUpdated(sw){if(appUpdated.done)return;appUpdated.done=true;
 let recent=false;try{recent=!sw&&Date.now()-Number(sessionStorage.getItem('pe-reloaded')||0)<30000}catch{}
 const busy=pttHeld||!!tch||running||cdEnd||recorder||(tab==='count'&&cn.phase!=='idle')||Object.keys(aiReq).length||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||$('dlg').open||$('scan');
 if(!busy&&!recent){try{sessionStorage.setItem('pe-reloaded',String(Date.now()))}catch{}location.reload();return}
 $('upd').hidden=false}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/androidplatform|app\.local/.test(location.host)){const hadSW=!!navigator.serviceWorker.controller;let chk=Date.now();
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.t==='updated')appUpdated()});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW)appUpdated(true)});
 // iPhone 从后台切回来不会重新打开页面，这时也问一下有没有新版（最多一分钟一次）
 document.addEventListener('visibilitychange',()=>{if(document.hidden||Date.now()-chk<60000)return;chk=Date.now();navigator.serviceWorker.getRegistration().then(r=>r?.update()).catch(()=>{});fetch('./',{cache:'no-cache'}).catch(()=>{})});
 navigator.serviceWorker.register('sw.js').catch(()=>{})}
